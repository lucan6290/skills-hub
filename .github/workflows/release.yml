name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri build -- --bundles nsis,msi

      - name: Prepare release notes
        shell: pwsh
        run: |
          node scripts/extract-changelog.mjs "${{ github.ref_name }}" > release-notes.md 2>$null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path release-notes.md) -or -not (Get-Content release-notes.md -Raw).Trim()) {
            Set-Content -Path release-notes.md -Value "Release ${{ github.ref_name }}`n`nSee CHANGELOG.md for release history." -Encoding utf8NoBOM
          }

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          draft: true
          body_path: release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
